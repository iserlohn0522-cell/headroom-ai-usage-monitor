name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Build fixture binary
        shell: pwsh
        run: .\build.ps1 -DebugFixture

      - name: Test parsers
        shell: pwsh
        run: .\tests\run-tests.ps1

  portable:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HEADROOM_UI_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'
      - name: Install Linux Tk and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb
      - name: Linux quota, provider and Tk sphere tests (Xvfb; no accounts)
        if: runner.os == 'Linux'
        run: |
          /usr/bin/python3 -c "import platform, tkinter; print(platform.platform(), tkinter.TkVersion)"
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_portable*.py' -v
          /usr/bin/python3 -m compileall -q portable examples/providers
      - name: Windows/macOS quota, provider and Tk sphere tests (no accounts)
        if: runner.os != 'Linux'
        run: |
          python -c "import platform, tkinter; print(platform.platform(), tkinter.TkVersion)"
          python -m unittest discover -s tests -p 'test_portable*.py' -v
      - name: Compile portable sources (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m compileall -q portable examples/providers

